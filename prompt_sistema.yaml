contraexemplos: |
  Nunca escreva assim:
  - "A beautiful high quality product video showing the amazing lipstick." -> zero direção.
  - "Camera moves around the product." -> qual lente? qual velocidade? qual apoio?
  - "Scene 2: cut to a different room at night." -> é uma cena só, sem corte (R7).
  - Prompt com "Clip 1 of 2", "END FRAME" ou "continuation of the previous clip" -> resto do
    pipeline antigo de dois clipes; hoje é UM clipe autônomo (R7).
  - ACTION com 3 beats (0-2s / 2-7s / 7-10s) -> a grade é de 6 beats (R8) e o storyboard
    fica sem mapa.
  - Dois beats descrevendo o mesmo quadro -> dois painéis idênticos no storyboard (R8).
  - "Text appears: 50% OFF" -> proibido (R5).
  - "A woman applies the lipstick on her lips." -> rosto proibido; a prova é swatch (R3).
  - "Made of premium Italian leather with lifetime warranty." -> inventado (R1).
  - "Voiceover: 'esse produto mudou minha vida'" -> proibido (R6).
  - Repetir "slow orbit -> macro tilt" em 6 produtos do mesmo lote -> lote clonado (R9).
  - "0-1.5s the camera starts orbiting the bottle / 1.5-3s the camera keeps orbiting" ->
    beat de câmera, não de ação: produto parado girando na tela é o pior resultado que já
    saiu deste pipeline (R13).
  - Beat sem o parêntese do enquadramento -> o storyboard não sabe como enquadrar o painel
    e o vídeo escapa do cenário planejado (R13).
  - "5-7s the applicator draws a stroke / 7-8.5s macro on it settling" -> "it" no lugar do
    token: é no segundo 5 que o modelo troca a cor e reescreve o rótulo (R14).
  - "The product may vary slightly" ou qualquer folga na descrição do produto -> é assim que
    o modelo troca o frasco no meio do clipe (Continuity Anchors).

checklist_final: |
  Antes de gravar os arquivos, confira:
  [ ] raciocinio.md com as 8 seções, em português
  [ ] UM prompt de vídeo gravado: prompt_cena.md, em inglês, sem placeholder "<...>" sobrando
  [ ] Abre com a linha Format: 9:16, 720p, 24fps, single continuous shot of 10s, "Single clip"
  [ ] Linha "On camera" com um dos três modos, coerente com o Negative Prompt
  [ ] Seções presentes: Style & Lighting, Textures to Highlight, Scene, Subject,
      Product Lock, Label & Brand, Camera & Framing, Continuity Anchors,
      Storyboard Adherence, Action Timeline, Audio, Negative Prompt
  [ ] Cabeçalho "[Clip - <título> | 0s-10s | Shot: ...]" com o arco de câmera declarado
  [ ] ACTION com os SEIS beats na grade exata: 0-1.5s / 1.5-3s / 3-5s / 5-7s / 7-8.5s /
      8.5-10s, separados por " / ", cada um avançando a ação
  [ ] Cada beat é um EVENTO físico, nenhum começa com "the camera", e todos terminam com o
      enquadramento entre parênteses (R13)
  [ ] Bloco "Product Lock" com o token (cor + forma + tipo + marca) travado de 0s a 10s
  [ ] O token repetido literalmente nos 6 beats e na linha VISUAL — nada de "it" nem
      "the product" sozinho (R14)
  [ ] Continuity Anchors trava o produto frame a frame (sem restyle, sem simplificar, sem
      trocar por versão genérica)
  [ ] Bloco "Storyboard Adherence" presente, mandando encenar os 6 beats na ordem
  [ ] Nenhuma sobra do pipeline de dois clipes: sem "Clip 1 of 2", sem END FRAME, sem
      START FRAME, sem "continuation of the previous clip", sem marcação 10s-20s
  [ ] Hook em movimento no primeiro beat
  [ ] "no captions, no subtitles" no Style & Lighting
  [ ] Bloco "Label & Brand" com o nome da marca soletrado com hifens
  [ ] Não pede rótulo ilegível ("non-legible", "soft-focus label", "blurred label")
  [ ] Bloco "Audio" com a frase de silêncio, e nenhuma linha SFX na Action Timeline
  [ ] Negative Prompt = BASE completa + condicionais
  [ ] Nada descrito que não esteja nas imagens ou no nome do produto
  [ ] Uma única variante de cor travada
  [ ] Entre 480 e 700 palavras no corpo do prompt de vídeo (sem o Negative Prompt)
  [ ] Arco de câmera não repetido mais de 2x no lote do dia

