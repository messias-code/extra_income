# ---------------------------------------------------------------------------
# 6b. A IMAGEM DE POST (1 foto estática por produto)
# ---------------------------------------------------------------------------
imagem_de_post: |
  Além dos dois clipes, cada produto ganha UMA imagem estática, gerada no Google Flow com as
  fotos reais do produto anexadas como referência. Ela é postada junto com os vídeos.

  O alvo é uma FOTO NOVA DO MESMO PRODUTO, não uma cópia da foto do anúncio:
  - o produto é idêntico: forma, variante de cor, acabamento, peças visíveis;
  - mudam o ÂNGULO, o ENQUADRAMENTO, o CENÁRIO e a pessoa (mãos ou modelo);
  - nada do layout do anúncio: sem fundo branco de catálogo, sem colagem, sem grade de
    variações, sem selo de preço, sem seta, sem texto, sem moldura.
  O porquê: a foto do anúncio é material de terceiro. Repetir o quadro dela — mesma pose,
  mesmo fundo, mesma pessoa, mesmo recorte — é copiar. Fotografar o mesmo objeto de outro
  ângulo, em outro cenário, com outra pessoa, não é.

  Coerência com os vídeos: mesma variante de cor travada, mesma família de cenário e mesma
  paleta dos dois clipes — o post inteiro precisa parecer o mesmo ensaio. O bloco Subject é
  COPIADO PALAVRA POR PALAVRA do prompt_cena1.md; ângulo, composição e cenário é que mudam.

  Valem as mesmas regras absolutas: R1 (grounding), R3 (sem rostos), R5 (rótulo exato,
  zero overlay),
  R11 (inglês) e R12 (autossuficiência).

  Tamanho: 250 a 410 palavras no corpo (sem contar o Negative Prompt).

gabarito_prompt_imagem: |
  Format: single still photograph, vertical 9:16, photoreal product photography
  On camera: <product only, no people | hands only, cropped at the wrist | headless model, cropped at the neck>. NO faces, NO captions, NO overlay text.

  Subject:
  <copiado palavra por palavra do bloco Subject do prompt_cena1.md>

  Label & Brand:
  <copiado palavra por palavra do bloco Label & Brand do prompt_cena1.md>

  New Angle & Framing:
  <ângulo declaradamente diferente do anúncio: altura da câmera, rotação do produto, lente, posição no quadro, profundidade de campo>

  Scene:
  <cenário real da mesma família dos vídeos, com props nomeados, mas outro recorte do ambiente>

  Light & Mood:
  <direção e temperatura da luz + paleta, coerentes com os clipes>

  Textures to Highlight:
  <3 a 5 texturas concretas observadas nas imagens>

  Model & Hands:
  <quando houver pessoa: descreva alguém DIFERENTE do das fotos de referência — outra roupa, outro tom de pele, unhas naturais — sempre cortada no pulso ou no pescoço. No modo "product only" escreva apenas: no people in frame.>

  Product Fidelity:
  The product must match the reference photos exactly: same shape, same colour variant, same finish, same proportions, same visible parts. Only the camera angle, the surroundings, the hands and the composition change. Do not redesign, restyle or simplify the product, and keep every word printed on it exactly as in the reference photos.

  Originality:
  This is a NEW photograph of the same object, not a copy of the reference images. Do not reproduce their background, layout, crop, pose or props. No catalogue white background, no collage, no panels, no badges, no added text or graphics of any kind. The only readable words in the photo are the ones printed on the product itself.

  Negative Prompt:
  <negative_prompt_imagem + condicionais aplicáveis do negative_prompt de vídeo>

negative_prompt_imagem: |
  BASE da imagem (sempre, integralmente):
  captions, overlay text, watermarks, UI overlays, emojis, invented logos, invented brand names, misspelled label, altered brand name, gibberish lettering, blurred out label, price badges, discount stickers, infographic elements, arrows, measurement charts, collage, multi-panel layout, product grid, duplicated product, mirrored copy of the reference photo, plain catalogue white background, cut-out product on flat backdrop, borders, frames, human faces, heads, facial features, eyes, mouths, crowds, people reflected in surfaces, morphing product, melting geometry, redesigned packaging, altered proportions, extra handles, invented compartments, floating parts, object inside object, surreal physics, plastic CGI look, oversaturation, blown highlights, low resolution, blurry, horizontal framing, letterboxing

  CONDICIONAIS: os mesmos do negative_prompt dos vídeos, conforme o modo escolhido
  (product only / hands only / headless model) e o tipo de produto (rótulo, líquido,
  partes móveis).

