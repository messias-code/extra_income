exemplos_few_shot:

  exemplo_1_maquiagem_maos:
    input:
      nome: "Batom Líquido Matte Longa Duração Lumine 24h Prova D'água Cor Vinho Nude"
      imagens: "batom líquido em tubo transparente com tampa preta fosca, aplicador doe-foot, laca vinho escuro, swatches no braço"
      metadata: "preço baixo, volume muito alto, fonte Top 10 geral"
    raciocinio_md: |
      GROUNDING: batom líquido em tubo de vidro transparente, tampa preta fosca cilíndrica
      presa ao aplicador doe-foot, pigmento vinho escuro visível pelo vidro, "LUMINE"
      impresso em branco no tubo; escala de palma da mão. Sem conflito título x foto.
      NOME LIMPO: long-wear matte liquid lipstick.
      CATEGORIA + CENÁRIO: maquiagem -> penteadeira de mármore claro com pano de algodão;
      paleta branco + vinho do próprio produto.
      MÉTRICAS: preço baixo + volume muito alto -> energia UGC, ritmo rápido.
      ÂNGULO DE VENDA: a cor real e a cobertura de um traço só.
      AÇÃO E RISCO: swatch no dorso da mão (N1). O aplicador já está fora do tubo em 0s,
      na mão direita: nada de abrir tampa em cena.
      ARCO DE CÂMERA: 7 (parallax slide -> gimbal float até o aplicador).
      CONFORMIDADE: hands only cortadas no pulso; 1 clipe de 8s com 6 beats; mudo; zero
      overlay; variante vinho travada; nenhum rosto.
      MARCA NO RÓTULO: "LUMINE", soletrado L-U-M-I-N-E.
    prompt_cena_md: |
      Format: vertical 9:16, 720p, 24fps | Single continuous shot of 8s | Single clip
      On camera: hands only, cropped at the wrist. NO faces, NO captions, NO subtitles.

      Style & Lighting:
      Clean beauty UGC commercial, bright and energetic, soft diffused daylight from the front left with a crisp rim of light along the glass, gentle falloff, white and deep wine palette, real-time speed with no slow motion, photoreal, no captions, no subtitles, no on-screen graphics.

      Textures to Highlight:
      glossy clear glass tube, matte black cap, dense wine-red liquid pigment, soft doe-foot applicator, honed white marble.

      Scene:
      A honed white marble vanity top, a folded white cotton cloth at the far left edge, a small ceramic dish blurred in the background, a pale plaster wall behind, nothing else on the surface.

      Subject:
      A long-wear matte liquid lipstick in a clear cylindrical glass tube filled with deep wine-red pigment, "LUMINE" printed vertically in white capitals on the tube, a cylindrical matte black cap attached to a slim wand with a soft doe-foot applicator.

      Product Lock:
      In every single frame, from 0s to 8s, the product is the same wine-red LUMINE glass tube: same colour, same shape, same proportions, same finish, same number of parts and the same printed wording. The label always reads "LUMINE". Nothing about the product changes, shifts colour, is re-labelled or is replaced at any point of the shot.

      Label & Brand:
      The tube reads exactly "LUMINE", spelled L-U-M-I-N-E, in white capitals running vertically up the glass. Keep the label artwork, wording and spelling identical in every frame, in focus and correctly spelled. Do not invent, translate, shorten or restyle any word printed on the product. This is the only text allowed anywhere in the frame.

      Camera & Framing:
      60mm macro lens, very shallow depth of field, gimbal-smooth motion at real-time speed: a brisk lateral parallax slide across the marble that rises into a float up to applicator height, one continuous move.

      Physics & Staging:
      At 0s the open wine-red LUMINE glass tube stands upright on the marble, and the right hand already holds the black cap with the applicator wand just above it; the left hand rests palm-down on the marble to the right. Only the right hand moves the applicator; the tube never moves, never tips and never refills. The applicator touches only the back of the left hand and leaves one single stroke. Nothing enters or leaves the frame except the two hands at the end. Risk level: N1.

      Continuity Anchors:
      Same product, same deep wine variant, same single tube, same label wording and placement, same honed marble surface and same lighting direction from the first to the last second. The product keeps the exact shape, proportions, finish and printed artwork in every single frame: it is never restyled, simplified, re-labelled, rescaled, swapped for a generic version or reshaped while the shot runs. The tube stays on the same spot of the marble.

      Storyboard Adherence:
      The attached storyboard sheet shows six stills of this same continuous take and the exact real product. Stage the six beats below exactly as written, in this order, same set, same props, same framing progression, with no invented location and no object entering the frame that was not described. Take the product's exact shape, colour and printed wording from the sheet. The output is one full-frame vertical shot: never a grid, never panels, and the small panel numerals never appear in the video.

      Action Timeline:
      [Clip - Wine Swatch | 0s-8s | Shot: brisk lateral parallax slide rising into a float]
      VISUAL: The camera slides across the marble as the right hand sweeps the applicator past the wine-red LUMINE glass tube, then floats up as one dense wine-red stroke lands on the back of the left hand beside the wine-red LUMINE glass tube.
      ACTION: 0-1.5s the right hand sweeps the applicator past the wine-red LUMINE glass tube as a rim of light runs along the glass (wide table-level shot) / 1.5-3s the whole wine-red LUMINE glass tube stands sharp on the marble while the left hand turns its back toward the lens (medium shot) / 3-4.5s the doe-foot applicator lands on the back of the left hand beside the wine-red LUMINE glass tube (medium close-up) / 4.5-6s the applicator draws one dense wine-red stroke across the skin in a single confident pass, the wine-red LUMINE glass tube sharp behind (close-up) / 6-7s the stroke sets matte and even, its shade matching the wine-red LUMINE glass tube (macro) / 7-8s the right hand rests the cap beside the wine-red LUMINE glass tube and both hands slide out of frame, the label facing the lens (medium shot).

      Audio:
      No audio. Silent clip: no music, no sound effects, no ambience, no voiceover, no speech.

      Negative Prompt:
      captions, subtitles, on-screen text, overlay text, title cards, watermarks, UI overlays, emojis, invented logos, invented brand names, misspelled label, altered brand name, gibberish lettering, blurred out label, label text changing between frames, music, sound effects, voiceover, speech, faces, eyes, mouths, people reflected in surfaces, morphing product, melting geometry, colour shifting product, redesigned label artwork, simplified packaging, generic unbranded packaging, product swapped between frames, altered proportions, duplicated product, extra parts, floating parts, objects appearing from nowhere, objects passing through each other, static product with only camera movement, slow motion, jump cuts, split screen, grid layout, panel borders, flicker, jitter, plastic CGI look, oversaturation, low resolution, horizontal framing, letterboxing, forearms, sleeves, human bodies, third hand, extra fingers, fused fingers, deformed hands, wrong letters on the label, extra words on the packaging, translated packaging, spills, dripping mess, water from the wrong outlet, liquid flowing upward

  exemplo_2_vestuario_headless:
    input:
      nome: "ARARA SPORT Legging De Treino Cintura Alta Com Bolso Lateral Poliamida Lisa Zero Transparente Conforto Estilo"
      imagens: "legging preta lisa, cintura alta larga, bolso lateral na coxa, costura central atrás, etiqueta tecida AERFIT no cós"
      metadata: "preço médio baixo, volume muito alto, fonte Comissao 10-15"
    raciocinio_md: |
      GROUNDING: legging preta opaca, cós largo de cintura alta com etiqueta tecida
      "AERFIT", bolso lateral chato na coxa direita, costura central traseira, brilho
      acetinado suave. O anúncio mostra só a preta.
      NOME LIMPO: high-waisted side-pocket training leggings.
      CATEGORIA + CENÁRIO: moda fitness -> canto de treino em casa com piso emborrachado e
      tapete de yoga enrolado; paleta cinza + preto.
      MÉTRICAS: preço baixo + volume muito alto -> cotidiano real, energia de UGC.
      ÂNGULO DE VENDA: opacidade no agachamento e o bolso que segura o celular.
      AÇÃO E RISCO: agachamento (N1) + celular escorregando no bolso (N2). O celular já
      está na mão direita desde 0s; o bolso já está aberto.
      ARCO DE CÂMERA: 4 (tracking lateral -> rack focus no bolso).
      CONFORMIDADE: headless model cortada no pescoço, top preto liso de apoio; 1 clipe de
      8s com 6 beats; mudo; zero overlay; variante preta travada.
      MARCA NO RÓTULO: "AERFIT" na etiqueta do cós, soletrado A-E-R-F-I-T.
    prompt_cena_md: |
      Format: vertical 9:16, 720p, 24fps | Single continuous shot of 8s | Single clip
      On camera: headless model, cropped at the neck. NO faces, NO captions, NO subtitles.

      Style & Lighting:
      Clean athletic UGC commercial, bright late-morning energy, soft diffused daylight from a tall window on the left, low contrast, neutral grey and black palette, real-time speed with no slow motion, photoreal, no captions, no subtitles, no on-screen graphics.

      Textures to Highlight:
      smooth matte black performance fabric with a faint satin sheen, thick high waistband, flat-lock seams, grey rubber flooring.

      Scene:
      A bare home training corner: grey rubber flooring, a pale concrete wall, a rolled sage yoga mat out of focus against the wall, daylight falling from the left.

      Subject:
      High-waisted black training leggings worn by a headless model cropped at the neck, with a plain black fitted crop top as the only other garment: wide supportive waistband with a small woven tag at the back, opaque smooth fabric, a flat open side pocket on the right thigh, a center back seam shaping the fit.

      Product Lock:
      In every single frame, from 0s to 8s, the product is the same black AERFIT high-waisted leggings: same colour, same shape, same proportions, same finish, same number of parts and the same printed wording. The label always reads "AERFIT". Nothing about the product changes, shifts colour, is re-labelled or is replaced at any point of the shot.

      Label & Brand:
      The woven tag on the back of the waistband reads exactly "AERFIT", spelled A-E-R-F-I-T, in white capitals on black. Keep the label artwork, wording and spelling identical in every frame, in focus and correctly spelled. Do not invent, translate, shorten or restyle any word printed on the product. This is the only text allowed anywhere in the frame.

      Camera & Framing:
      35mm lens, medium depth of field, handheld-smooth lateral tracking shot at real-time speed alongside the model that settles at hip height and racks focus onto the thigh pocket, one continuous move.

      Physics & Staging:
      At 0s the model is already mid-stride across the corner, holding a black smartphone in the right hand; the thigh pocket is flat and open. The model walks, sinks into one squat, rises and slides the phone into the pocket with the right hand in one motion; the left arm stays relaxed. The fabric stretches over the knee in the squat and stays fully opaque. Nothing enters or leaves the frame. Risk level: N2.

      Continuity Anchors:
      Same product, same black variant, same single garment, same woven tag wording and placement, same rubber floor and same lighting direction from the first to the last second. The product keeps the exact shape, proportions, finish and printed artwork in every single frame: it is never restyled, simplified, re-labelled, rescaled, swapped for a generic version or reshaped while the shot runs. The phone stays the same black phone and ends inside the pocket.

      Storyboard Adherence:
      The attached storyboard sheet shows six stills of this same continuous take and the exact real product. Stage the six beats below exactly as written, in this order, same set, same props, same framing progression, with no invented location and no object entering the frame that was not described. Take the product's exact shape, colour and printed wording from the sheet. The output is one full-frame vertical shot: never a grid, never panels, and the small panel numerals never appear in the video.

      Action Timeline:
      [Clip - Fit in Motion | 0s-8s | Shot: lateral tracking shot settling into a rack focus]
      VISUAL: The camera tracks alongside the headless model striding through the training corner, the black AERFIT high-waisted leggings flexing and staying opaque through a squat, then settles at hip height as the phone slides into the pocket of the black AERFIT high-waisted leggings.
      ACTION: 0-1.5s the model is already mid-stride and the black AERFIT high-waisted leggings flex with each step (wide shot) / 1.5-3s the stride carries the full silhouette of the black AERFIT high-waisted leggings from waistband to ankle past the window light (full shot) / 3-4.5s the model drops into a deep squat and the black AERFIT high-waisted leggings stretch over the knee without going sheer (medium shot) / 4.5-6s the model springs up and the right hand slides the phone flat into the thigh pocket of the black AERFIT high-waisted leggings in one move (medium close-up) / 6-7s the phone sits snug and the flat-lock seam of the black AERFIT high-waisted leggings snaps into focus (macro) / 7-8s the model turns a quarter to the side and holds, the waistband tag of the black AERFIT high-waisted leggings facing the lens (medium shot).

      Audio:
      No audio. Silent clip: no music, no sound effects, no ambience, no voiceover, no speech.

      Negative Prompt:
      captions, subtitles, on-screen text, overlay text, title cards, watermarks, UI overlays, emojis, invented logos, invented brand names, misspelled label, altered brand name, gibberish lettering, blurred out label, label text changing between frames, music, sound effects, voiceover, speech, faces, eyes, mouths, people reflected in surfaces, morphing product, melting geometry, colour shifting product, redesigned label artwork, simplified packaging, generic unbranded packaging, product swapped between frames, altered proportions, duplicated product, extra parts, floating parts, objects appearing from nowhere, objects passing through each other, static product with only camera movement, slow motion, jump cuts, split screen, grid layout, panel borders, flicker, jitter, plastic CGI look, oversaturation, low resolution, horizontal framing, letterboxing, head, chin, neck above the collar, mannequin joints, distorted body proportions, extra limbs, wrong letters on the label, extra words on the packaging, translated packaging, see-through fabric, extra sleeves, floating garment, wrinkled distorted seams, visible underwear, nudity

contraexemplos: |
  Nunca escreva assim:
  - "A beautiful high quality product video showing the amazing lipstick." -> zero direção.
  - "Camera moves around the product." -> qual lente? qual velocidade? qual ação?
  - "Scene 2: cut to a different room." -> é uma cena só (R7).
  - "Clip 1 of 2", "END FRAME", "continuation" -> pipeline antigo de dois clipes (R7).
  - ACTION com 3 beats -> a grade é de 6 (R8).
  - "Text appears: 50% OFF" -> proibido (R5).
  - "A woman applies the lipstick on her lips." -> rosto proibido (R3).
  - "Made of premium Italian leather." -> inventado (R1).
  - "0-1.5s the camera starts orbiting the bottle" -> beat de câmera, não de ação (R13).
  - "4.5-6s it sprays" -> "it" no lugar do token (R14).
  - "the hand unscrews the cap and pours capsules" -> N3 e cápsula inventada (R4, R1).
  - "a hand brings a plate into the microwave" sem o prato declarado em 0s -> objeto do
    nada (R16).
  - "the watch screen swipes through apps" -> UI animada, dígitos derretendo (R5).
  - "slowly, gently, softly" em todos os beats -> vídeo lento (R15).
  - "as in the reference photos" -> o vídeo não recebe foto (R12).
  - "Flow Commands: /goldenhour /orbit" -> slash commands não são recurso oficial do Flow;
    viram texto solto no prompt. Escreva a direção em frase.

checklist_final: |
  [ ] raciocinio.md com os 9 itens, em português, conflitos registrados
  [ ] Format: 9:16, 720p, 24fps, "Single continuous shot of 8s", "Single clip"
  [ ] "On camera" com um dos modos, coerente com o Negative e com as ações
  [ ] Seções: Style & Lighting, Textures to Highlight, Scene, Subject, Product Lock,
      Label & Brand, Camera & Framing, Physics & Staging, Continuity Anchors,
      Storyboard Adherence, Action Timeline, Audio, Negative Prompt
  [ ] Style com "real-time speed with no slow motion" e "no captions, no subtitles"
  [ ] Cabeçalho "[Clip - <título> | 0s-8s | Shot: ...]"
  [ ] ACTION com 0-1.5s / 1.5-3s / 3-4.5s / 4.5-6s / 6-7s / 7-8s, cada um um EVENTO
      terminando com o plano entre parênteses, nenhum começando por "the camera"
  [ ] Token no Product Lock, repetido nos 6 beats e no VISUAL
  [ ] Physics & Staging declara tudo que aparece nos beats, com o nível de risco
  [ ] No máximo uma ação N2, nenhuma N3
  [ ] Label & Brand soletrado (ou "no visible branding"); display com conteúdo fixo
  [ ] Audio de silêncio; Negative = BASE + condicionais
  [ ] Nada que não esteja nas fotos; variante única
  [ ] 520 a 800 palavras no corpo
  [ ] Arco não repetido mais de 2x no lote
