contraexemplos: |
  Nunca escreva assim:
  - "A beautiful high quality product video showing the amazing cookware set." -> zero direção.
  - "Camera moves around the product." -> qual lente? qual velocidade? qual apoio?
  - "Scene 2: cut to a different kitchen at night." -> quebra a continuidade (R8).
  - Clipe 2 abrindo com "A wide shot of the kitchen counter" -> vira vídeo novo, a emenda
    aparece; ele abre no START FRAME do Clipe 1 (R8).
  - Clipe 2 com a Action Timeline marcada 10s-20s -> o Flow lê como clipe de 20s (R7).
  - "Text appears: 50% OFF" -> proibido (R5).
  - Imagem de post repetindo o quadro do anúncio (mesmo top-down, mesmo fundo liso, mesma
    pose) -> é cópia da foto de terceiro, não uma foto nova (imagem_de_post).
  - "a product photo on a clean white background" na imagem de post -> vira catálogo e
    denuncia a origem; o cenário é real e é outro (imagem_de_post).
  - "A woman smiles while holding the product." -> proibido (R3).
  - "Made of premium anodized aluminum with 5-year warranty." -> inventado (R1).
  - "Voiceover: 'esse produto mudou minha vida'" -> proibido (R6).
  - Repetir "slow orbit -> macro tilt" em 6 produtos do mesmo lote -> lote clonado (R9).

checklist_final: |
  Antes de gravar os arquivos, confira:
  [ ] raciocinio.md com as 8 seções, em português
  [ ] DOIS prompts gravados: prompt_cena1.md e prompt_cena2.md, em inglês, sem placeholder
      "<...>" sobrando
  [ ] Cada arquivo abre com a linha Format: 9:16, 720p, 24fps, single continuous shot of 10s,
      e o rótulo "Clip 1 of 2" / "Clip 2 of 2 - direct continuation of clip 1"
  [ ] Cada arquivo com a linha "On camera" no MESMO modo, coerente com o Negative Prompt
  [ ] Seções presentes nos dois: Style & Lighting, Textures to Highlight, Scene, Subject,
      Camera & Framing, Continuity Anchors, Action Timeline, Audio Design, Negative Prompt
  [ ] Style & Lighting, Textures, Scene e Subject IDÊNTICOS palavra por palavra nos dois
  [ ] Camera & Framing diferente entre os dois (o par de planos), mesma lente e mesmo apoio
  [ ] Clipe 1 termina com a linha END FRAME
  [ ] Clipe 2 tem a linha START FRAME com "CONTINUES FROM THE FINAL FRAME OF THE PREVIOUS
      CLIP" e o texto do END FRAME repetido palavra por palavra
  [ ] Os dois com marcação de tempo LOCAL 0s-10s (nada de 10s-20s)
  [ ] VISUAL do Clipe 2 começa com "STRICT CONTINUATION FROM THE PREVIOUS CLIP"
  [ ] ACTION do Clipe 1 em 0-2s / 2-7s / 7-10s; do Clipe 2 em 0-2s / 2-8s / 8-10s
  [ ] Hook em movimento nos 2 primeiros segundos do Clipe 1
  [ ] "no captions, no subtitles" no Style & Lighting dos dois
  [ ] Bloco "Label & Brand" nos dois, com o nome da marca soletrado com hifens e idêntico
      palavra por palavra entre os dois arquivos
  [ ] Nenhum dos dois pede rótulo ilegível ("non-legible", "soft-focus label", "blurred label")
  [ ] Bloco "Audio" nos dois com a frase de silêncio, e nenhuma linha SFX na Action Timeline
  [ ] Negative Prompt = BASE completa + condicionais, igual nos dois arquivos
  [ ] Nada descrito que não esteja nas imagens ou no nome do produto
  [ ] Uma única variante de cor travada nos dois clipes
  [ ] Entre 380 e 540 palavras no corpo de CADA prompt de vídeo (sem o Negative Prompt)
  [ ] Par de planos não repetido mais de 2x no lote do dia

  E no prompt_imagem.md:
  [ ] Linha Format: single still photograph, vertical 9:16
  [ ] Linha "On camera" no MESMO modo dos vídeos
  [ ] Seções presentes: Subject, Label & Brand, New Angle & Framing, Scene, Light & Mood,
      Textures to Highlight, Model & Hands, Product Fidelity, Originality, Negative Prompt
  [ ] Subject e Label & Brand copiados palavra por palavra do prompt_cena1.md
  [ ] Ângulo, enquadramento e recorte de cenário declaradamente diferentes da foto do anúncio
  [ ] Mãos/modelo descritos como pessoa diferente da das fotos de referência
  [ ] Mesma variante de cor e mesma paleta dos dois clipes
  [ ] Negative Prompt = BASE da imagem + condicionais do modo escolhido
  [ ] Entre 250 e 410 palavras no corpo (sem contar o Negative Prompt)
