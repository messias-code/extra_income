checklist_final: |
  Antes de gravar o prompt_capa.md, confira:
  [ ] Linha Format com "single still photograph", "4:5" e "promotional cover shot"
  [ ] Linha "On camera" com o MESMO modo do vídeo + "No price, no numbers, no percentages"
  [ ] Seções presentes: Art Direction, Subject, Label & Brand, Layout & Composition,
      Promo Copy, Text Style, Scene, Light & Mood, Textures to Highlight, Model & Hands,
      Product Fidelity, Originality, Negative Prompt
  [ ] Art Direction com o fundo contextual do nicho do produto
  [ ] Subject copiado palavra por palavra do prompt_cena.md
  [ ] Label & Brand copiado, com a última frase trocada pela da peça de divulgação
  [ ] Produto em destaque, inteiro, nítido, sem nada cobrindo, com sombra natural no cenário
  [ ] Área limpa reservada para o texto, com margem e respiro
  [ ] Exatamente 3 linhas: título (até 4 palavras), benefício (até 6), CTA (até 3)
  [ ] Título soletrado com hifens; cada linha entre aspas e escrita exata
  [ ] Nenhuma chamada apelativa: sem "compre já", "garanta o seu", "premium", "exclusivo",
      "feito para durar", sem ponto de exclamação
  [ ] ZERO preço, "R$", número, porcentagem, selo, botão, ícone, seta ou emoji na imagem
  [ ] Texto fora do produto, nunca por cima dele
  [ ] Cenário e ângulo diferentes dos do vídeo e dos da foto do anúncio
  [ ] Fundo branco de catálogo, ciclorama e colagem proibidos
  [ ] Negative Prompt = BASE da capa + condicionais, sem "captions" nem "letters" soltos
  [ ] Entre 400 e 650 palavras no corpo (sem o Negative Prompt)
  [ ] Arquivo com o prompt puro: sem cerca de código, sem cabeçalho, sem placeholder
