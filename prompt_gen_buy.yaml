      This is a new photograph of the same object, not a copy of the reference images: different angle, different framing, different surroundings and different composition. No catalogue white background, no collage, no panels, no badges.

      Negative Prompt:
      price tags, prices, currency symbols, percentages, discount badges, promotional stickers, sale seals, round seals, big buttons, call to action buttons, infographic elements, measurement charts, flyer layout, ready-made template look, generic AI look, pasted-on product, fake shadows, misspelled Portuguese words, missing accents, gibberish lettering, extra words, invented words, duplicated text, paragraphs of text, text on top of the product, watermarks, UI overlays, Instagram interface, invented logos, invented brand names, misspelled label, altered brand name, blurred out label, collage, multi-panel layout, duplicated product, plain catalogue white background, borders, frames, faces, heads, eyes, mouths, people reflected in surfaces, morphing product, redesigned packaging, simplified packaging, altered proportions, altered colours, floating parts, plastic CGI look, flat unedited photo, oversaturation, blown highlights, low resolution, blurry, horizontal framing, cropped product, product hidden behind hands, doodles, scribbles, stickers, handwritten fonts, clip art, cartoon icons, hands, arms, fingers, human bodies, wrong letters on the label, extra words on the packaging, translated packaging, detached parts, warping frame geometry

checklist_final: |
  Antes de gravar o prompt_capa.md, confira:
  [ ] Família escolhida (A brand editorial | B lifestyle scrapbook) e coerente em Format,
      Art Direction, Text Style e Negative
  [ ] Format com "single still photograph", "vertical 3:4 canvas for a 4:5 Instagram feed
      post" e "<família> promotional cover shot" (slide 2: "<família> carousel slide 2")
  [ ] On camera com o MESMO modo do vídeo + a frase de preço/números
  [ ] Seções: Art Direction, Subject, Label & Brand, Layout & Composition, Promo Copy,
      Text Style, Scene, Light & Mood, Textures to Highlight, Model & Hands,
      Product Fidelity, Originality, Negative Prompt
  [ ] Área segura 3:4 declarada no Art Direction
  [ ] Subject copiado palavra por palavra; Label & Brand copiado com a última frase trocada
