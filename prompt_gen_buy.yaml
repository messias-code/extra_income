# EXEMPLOS
# ---------------------------------------------------------------------------
exemplos:

  exemplo_1_familia_B_maquiagem:
    input_prompt_cena: |
      roteiro do batom líquido matte LUMINE (hands only; bancada de mármore claro; swatch
      vinho no dorso da mão; token "wine-red LUMINE glass tube"). Família B: maquiagem.
    output_prompt_capa: |
      Format: single still photograph with handwritten Portuguese text and hand-drawn doodles, vertical 3:4 canvas for a 4:5 Instagram feed post, lifestyle scrapbook promotional cover shot
      On camera: hands only, cropped at the wrist. NO faces. No price, no currency, no percentages and no numbers in the added copy; anything printed on the product itself stays exactly as it is.

      Art Direction:
      Aesthetic lifestyle creator post, cozy, delicate and spontaneous, a real photograph with hand-drawn doodles over it in fine imperfect deep wine lines: two tiny hearts, three small sparkles, a little five-petal flower and a dotted line tracing the tube outline without touching the label. Soft blush, cream and deep wine palette taken from the product, gentle warm colour grade. Instagram-ready: the 3:4 canvas is cropped to 4:5 in the feed, so every word and the whole product stay central, with wide empty margins on all four sides.

      Subject:
      A long-wear matte liquid lipstick in a clear cylindrical glass tube filled with deep wine-red pigment, "LUMINE" printed vertically in white capitals on the tube, a cylindrical matte black cap attached to a slim wand with a soft doe-foot applicator.

      Label & Brand:
      The tube reads exactly "LUMINE", spelled L-U-M-I-N-E, in white capitals running vertically up the glass. Keep the label artwork, wording and spelling identical in every frame, in focus and correctly spelled. Do not invent, translate, shorten or restyle any word printed on the product. The product label and the Portuguese copy described below are the only text in the frame.

      Layout & Composition:
      The tube stands upright and large on the right third of the frame, slightly angled toward the lens, whole and sharp, its base on a linen runner with a soft contact shadow falling left. A single dense wine swatch lies on the back of a relaxed hand at the lower left. The upper left is clean plaster wall carrying the copy: large title, smaller benefit line under it, tiny call to action lower down. Two thin hand-drawn arrows curve from the callouts to the applicator and to the swatch.

      Promo Copy (Brazilian Portuguese, render exactly, nothing else):
      Line 1, title: "Cor que fica", spelled C-O-R Q-U-E F-I-C-A.
      Line 2, benefit line: "Matte intenso num traço só".
      Line 3, small call to action: "Link na bio".
      Callout 1, small handwritten note with a thin arrow to the doe-foot applicator: "Aplicador macio".
      Callout 2, small handwritten note with a thin arrow to the swatch: "Tom vinho".
      Render these lines exactly as written, in correct Brazilian Portuguese with accents. No other word, letter, number or symbol anywhere in the image besides the product's own printed text.

      Text Style:
      Neat, legible handwritten lettering in deep wine ink, the title large with a soft underline doodle, the benefit line half its size, the call to action small and quiet, left-aligned with wide margins, blended with the doodles. No button, no text box, no sale badge, no round seal.

      Scene:
      A sunlit dressing corner: a warm pale plaster wall, a natural linen runner under the tube, a small ceramic dish blurred at the lower edge, open clean wall space at the upper left for the copy.

      Light & Mood:
      Soft directional morning light from the right, warm and clean, gentle falloff with natural contact shadows, cozy and spontaneous self-care mood, polished warm colour grade.

      Textures to Highlight:
      glossy clear glass, matte black cap, dense wine-red pigment, woven natural linen, matte plaster wall.

      Model & Hands:
      One hand only, cropped at the wrist, clean natural short nails, resting relaxed on the linen at the lower left with the swatch on its back, never touching or covering the product.

      Product Fidelity:
      The product must match the attached reference photos exactly: same shape, same colour variant, same finish and texture, same proportions, same visible parts. Do not redesign, restyle or simplify it, and keep every word and number printed on it exactly as in the reference photos.

      Originality:
      This is a new photograph of the same object, not a copy of the reference images: different angle, different framing, different surroundings and different composition. No catalogue white background, no collage, no panels, no badges.

      Negative Prompt:
      price tags, prices, currency symbols, percentages, discount badges, promotional stickers, sale seals, round seals, big buttons, call to action buttons, infographic elements, measurement charts, flyer layout, ready-made template look, generic AI look, pasted-on product, fake shadows, misspelled Portuguese words, missing accents, gibberish lettering, extra words, invented words, duplicated text, paragraphs of text, text on top of the product, watermarks, UI overlays, Instagram interface, invented logos, invented brand names, misspelled label, altered brand name, blurred out label, collage, multi-panel layout, duplicated product, plain catalogue white background, borders, frames, faces, heads, eyes, mouths, people reflected in surfaces, morphing product, redesigned packaging, simplified packaging, altered proportions, altered colours, floating parts, plastic CGI look, flat unedited photo, oversaturation, blown highlights, low resolution, blurry, horizontal framing, cropped product, product hidden behind hands, corporate layout, 3D icons, 3D emojis, speech bubbles, doodles over the label, excessive gold elements, forearms, sleeves, human bodies, third hand, extra fingers, fused fingers, deformed hands, wrong letters on the label, extra words on the packaging, translated packaging

  exemplo_2_familia_A_eletro:
