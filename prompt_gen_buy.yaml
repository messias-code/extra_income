      callouts de 2-3 palavras; total ≤13 (A) ou ≤20 (B)
  [ ] Título soletrado com hifens; português correto e acentuado
  [ ] Zero preço, "R$", número, porcentagem, exclamação, chamada apelativa no texto
  [ ] Frase de benefício e callouts verificáveis nas fotos
  [ ] Texto fora do produto; produto inteiro, grande, com sombra de contato
  [ ] Cenário e ângulo diferentes dos do vídeo e da foto do anúncio
  [ ] Negative = BASE + condicional da família + condicionais do vídeo sem os de movimento
